<!doctype html>
<html lang="en">
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#f5f8f7">
      <title>Sequence Explorer | DMD Scenario Runner</title>
    <style>
          :root {
                  color-scheme: light;
                  --ink: #18312e;
                  --muted: #5d706c;
                  --green: #176c5b;
                  --green-dark: #105244;
                  --mint: #e6f3ed;
                  --line: #dbe5e1;
                  --paper: #fff;
                  --canvas: #f5f8f7;
                  --alert: #fff4df;
                  --alert-ink: #704a0e;
                  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }

          * { box-sizing: border-box; }

          body {
                  margin: 0;
                  background: var(--canvas);
                  color: var(--ink);
                  line-height: 1.5;
          }

          .page {
                  width: min(100% - 40px, 980px);
                  margin: 0 auto;
                  padding: 28px 0 56px;
          }

          .topline {
                  display: flex;
                  align-items: center;
                  gap: 10px;
                  color: var(--green-dark);
                  font-size: .9rem;
                  font-weight: 700;
                  letter-spacing: .02em;
          }

          .mark {
                  display: grid;
                  width: 34px;
                  height: 34px;
                  place-items: center;
                  border-radius: 11px;
                  background: var(--mint);
                  font-size: 1.15rem;
          }

          header { margin: 48px 0 28px; }

          h1 {
                  max-width: 700px;
                  margin: 0 0 12px;
                  font-size: clamp(2rem, 5vw, 3.25rem);
                  letter-spacing: -.045em;
                  line-height: 1.08;
          }

          header p {
                  max-width: 680px;
                  margin: 0;
                  color: var(--muted);
                  font-size: 1.08rem;
          }

          .privacy {
                  display: flex;
                  gap: 12px;
                  align-items: flex-start;
                  margin: 26px 0;
                  padding: 15px 17px;
                  border: 1px solid #eadbb7;
                  border-radius: 12px;
                  background: var(--alert);
                  color: var(--alert-ink);
                  font-size: .93rem;
          }

          .privacy strong { display: block; margin-bottom: 2px; }
          .privacy p { margin: 0; }

          .workspace {
                  display: grid;
                  grid-template-columns: minmax(0, 1.5fr) minmax(240px, .8fr);
                  gap: 20px;
                  align-items: start;
          }

          .panel {
                  border: 1px solid var(--line);
                  border-radius: 16px;
                  background: var(--paper);
                  box-shadow: 0 8px 24px rgb(20 55 46 / 4%);
          }

          .input-panel { padding: 24px; }

          h2 {
                  margin: 0 0 6px;
                  font-size: 1.16rem;
                  letter-spacing: -.015em;
          }

          .hint {
                  margin: 0 0 18px;
                  color: var(--muted);
                  font-size: .9rem;
          }

          label {
                  display: block;
                  margin-bottom: 8px;
                  font-size: .9rem;
                  font-weight: 700;
          }

          textarea {
                  display: block;
                  width: 100%;
                  min-height: 250px;
                  resize: vertical;
                  padding: 15px;
                  border: 1px solid #b9cbc5;
                  border-radius: 10px;
                  background: #fcfdfd;
                  color: var(--ink);
                  font: 500 .94rem/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          }

          textarea:focus {
                  border-color: var(--green);
                  outline: 3px solid rgb(23 108 91 / 15%);
          }

          .input-note {
                  margin: 8px 0 0;
                  color: var(--muted);
                  font-size: .82rem;
          }

          .actions {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 10px;
                  margin-top: 18px;
          }

          button {
                  min-height: 43px;
                  padding: 9px 16px;
                  border: 1px solid transparent;
                  border-radius: 9px;
                  cursor: pointer;
                  font: inherit;
                  font-size: .92rem;
                  font-weight: 700;
          }

          button:focus-visible {
                  outline: 3px solid rgb(23 108 91 / 28%);
                  outline-offset: 2px;
          }

          .primary { background: var(--green); color: white; }
          .primary:hover { background: var(--green-dark); }
          .secondary { border-color: var(--line); background: white; color: var(--ink); }
          .secondary:hover { background: #f2f7f5; }

          .results { padding: 22px; }
          .results h2 { margin-bottom: 16px; }

          .empty {
                  padding: 18px 14px;
                  border: 1px dashed #cbd9d4;
                  border-radius: 10px;
                  color: var(--muted);
                  font-size: .9rem;
                  text-align: center;
          }

          .stats {
                  display: grid;
                  grid-template-columns: 1fr 1fr;
                  gap: 10px;
          }

          .stat {
                  min-width: 0;
                  padding: 13px;
                  border-radius: 10px;
                  background: #f3f8f6;
          }

          .stat span {
                  display: block;
                  color: var(--muted);
                  font-size: .78rem;
          }

          .stat strong {
                  display: block;
                  margin-top: 3px;
                  font-size: 1.24rem;
                  overflow-wrap: anywhere;
          }

          .composition {
                  margin-top: 17px;
                  padding-top: 15px;
                  border-top: 1px solid var(--line);
          }

          .composition h3 { margin: 0 0 9px; font-size: .9rem; }
          .base-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: .88rem; }
          .base-row span:first-child { color: var(--muted); }

          .scenario-panel { margin-top: 20px; padding: 24px; }

          .scenario-notice {
                  margin: 14px 0 20px;
                  padding: 12px 14px;
                  border-radius: 10px;
                  background: #f3f8f6;
                  color: var(--muted);
                  font-size: .88rem;
          }

          .scenario-grid {
                  display: grid;
                  grid-template-columns: repeat(3, minmax(0, 1fr));
                  gap: 12px;
          }

          .scenario-card {
                  padding: 15px;
                  border: 1px solid var(--line);
                  border-radius: 11px;
          }

          .scenario-card h3 { margin: 0 0 12px; font-size: .97rem; }
          .scenario-card label, .criteria label { font-size: .82rem; }
          .scenario-card input, .criteria input[type="text"], .case-label input {
                  display: block;
                  width: 100%;
                  min-height: 39px;
                  margin-top: 5px;
                  padding: 8px 10px;
                  border: 1px solid #b9cbc5;
                  border-radius: 8px;
                  color: var(--ink);
                  font: inherit;
          }

          .criteria {
                  display: grid;
                  grid-template-columns: minmax(120px, 1fr) 140px;
                  gap: 10px;
                  align-items: end;
                  margin: 14px 0;
          }
